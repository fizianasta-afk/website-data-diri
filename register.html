<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Data Diri</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .pin-box {
            margin-top: 25px;
            padding: 20px;
            background: #f0f2ff;
            border-radius: 15px;
            border: 2px solid #667eea;
        }

        .pin-box h2 {
            color: #667eea;
            margin-top: 0;
        }

        .pin-info {
            font-size: 14px;
            color: #555;
        }

        .pin-input {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
        }

        .pin-input:focus {
            border-color: #667eea;
            outline: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📝 Register Data Diri</h1>

    <p>Silakan isi data diri kamu.</p>

    <input
        id="nama"
        type="text"
        placeholder="Nama"
    >

    <input
        id="sekolah"
        type="text"
        placeholder="Sekolah"
    >

    <input
        id="umur"
        type="number"
        placeholder="Umur"
    >

    <input
        id="cita"
        type="text"
        placeholder="Cita-cita"
    >

    <input
        id="hobi"
        type="text"
        placeholder="Hobi"
    >


    <!-- PIN -->

    <div class="pin-box">

        <h2>🔐 Buat PIN Pribadi</h2>

        <p class="pin-info">
            PIN ini digunakan untuk masuk ke
            <strong>Jadwal Pelajaran</strong>
            dan
            <strong>Edit Jadwal</strong>.
        </p>

        <input
            id="pin"
            class="pin-input"
            type="password"
            inputmode="numeric"
            maxlength="6"
            placeholder="6 DIGIT"
        >

        <input
            id="konfirmasiPin"
            class="pin-input"
            type="password"
            inputmode="numeric"
            maxlength="6"
            placeholder="ULANGI PIN"
        >

    </div>


    <button
        class="button"
        onclick="simpanData()"
    >
        💾 DAFTAR
    </button>

    <a
        href="index.html"
        class="button"
    >
        🏠 KEMBALI
    </a>

</div>


<script>

function simpanData() {

    const nama =
        document.getElementById("nama").value.trim();

    const sekolah =
        document.getElementById("sekolah").value.trim();

    const umur =
        document.getElementById("umur").value.trim();

    const cita =
        document.getElementById("cita").value.trim();

    const hobi =
        document.getElementById("hobi").value.trim();

    const pin =
        document.getElementById("pin").value.trim();

    const konfirmasiPin =
        document.getElementById("konfirmasiPin").value.trim();


    if (
        nama === "" ||
        sekolah === "" ||
        umur === "" ||
        cita === "" ||
        hobi === ""
    ) {

        alert("⚠️ Semua data diri harus diisi!");

        return;
    }


    if (!/^[0-9]{6}$/.test(pin)) {

        alert("⚠️ PIN harus tepat 6 angka!");

        return;
    }


    if (pin !== konfirmasiPin) {

        alert("❌ Konfirmasi PIN tidak cocok!");

        return;
    }


    const data = {

        nama: nama,
        sekolah: sekolah,
        umur: umur,
        cita: cita,
        hobi: hobi,
        pin: pin

    };


    localStorage.setItem(
        "dataDiri",
        JSON.stringify(data)
    );


    const jadwalKosong = {

        Senin: [],
        Selasa: [],
        Rabu: [],
        Kamis: [],
        Jumat: [],
        Sabtu: []

    };


    localStorage.setItem(
        "jadwalSekolah",
        JSON.stringify(jadwalKosong)
    );


    alert("✅ Data berhasil disimpan!");


    window.location.href = "profil.html";

}

</script>

</body>
</html>
